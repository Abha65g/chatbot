<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MediCare AI</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            background: linear-gradient(135deg,#0f172a,#1e293b,#111827);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .chat-container{
            width:100%;
            max-width:950px;
            height:92vh;
            background:rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            border-radius:24px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0 10px 40px rgba(0,0,0,0.5);
        }

        .chat-header{
            padding:20px;
            background:rgba(255,255,255,0.05);
            border-bottom:1px solid rgba(255,255,255,0.1);
            display:flex;
            align-items:center;
            gap:15px;
        }

        .bot-icon{
            width:55px;
            height:55px;
            border-radius:50%;
            background:linear-gradient(135deg,#06b6d4,#3b82f6);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:24px;
        }

        .header-text h2{
            color:white;
            font-size:24px;
        }

        .header-text p{
            color:#cbd5e1;
            margin-top:4px;
            font-size:14px;
        }

        .disclaimer{
            background:rgba(255,255,255,0.08);
            color:#facc15;
            padding:10px;
            margin:15px;
            border-radius:10px;
            font-size:13px;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:25px;
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        .message{
            max-width:80%;
            padding:16px 18px;
            border-radius:18px;
            line-height:1.7;
            font-size:15px;
            word-wrap:break-word;
            animation:fadeIn 0.3s ease;
        }

        .user-message{
            align-self:flex-end;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            border-bottom-right-radius:6px;
        }

        .bot-message{
            align-self:flex-start;
            background:rgba(255,255,255,0.1);
            color:white;
            border-bottom-left-radius:6px;
        }

        .message p{
            margin:10px 0;
        }

        .message ul,
        .message ol{
            padding-left:20px;
            margin-top:10px;
        }

        .message li{
            margin:6px 0;
        }

        .message strong{
            color:#ffffff;
        }

        .message code{
            background:#0f172a;
            color:#38bdf8;
            padding:3px 6px;
            border-radius:6px;
        }

        .typing{
            display:none;
            padding:0 25px 15px;
        }

        .typing span{
            width:10px;
            height:10px;
            background:#cbd5e1;
            border-radius:50%;
            display:inline-block;
            margin:0 3px;
            animation:bounce 1.2s infinite;
        }

        .typing span:nth-child(2){
            animation-delay:0.2s;
        }

        .typing span:nth-child(3){
            animation-delay:0.4s;
        }

        .input-area{
            padding:20px;
            background:rgba(255,255,255,0.04);
            border-top:1px solid rgba(255,255,255,0.08);
            display:flex;
            gap:15px;
        }

        .input-area input{
            flex:1;
            padding:16px;
            border:none;
            outline:none;
            border-radius:14px;
            background:rgba(255,255,255,0.1);
            color:white;
            font-size:15px;
        }

        .input-area input::placeholder{
            color:#cbd5e1;
        }

        .send-btn{
            width:58px;
            border:none;
            border-radius:14px;
            cursor:pointer;
            background:linear-gradient(135deg,#06b6d4,#2563eb);
            color:white;
            font-size:18px;
            transition:0.3s;
        }

        .send-btn:hover{
            transform:scale(1.05);
        }

        .messages::-webkit-scrollbar{
            width:6px;
        }

        .messages::-webkit-scrollbar-thumb{
            background:#475569;
            border-radius:10px;
        }

        @keyframes bounce{
            0%,80%,100%{
                transform:translateY(0);
                opacity:0.5;
            }

            40%{
                transform:translateY(-8px);
                opacity:1;
            }
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px){

            .message{
                max-width:92%;
            }

            .chat-container{
                height:96vh;
            }

            .header-text h2{
                font-size:20px;
            }
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <div class="bot-icon">
            <i class="fa-solid fa-user-doctor"></i>
        </div>

        <div class="header-text">
            <h2>MediCare AI Assistant</h2>
            <p>AI Powered Medical Chatbot</p>
        </div>

    </div>

    <div class="disclaimer">
        ⚠ This chatbot is for educational purposes only and not medical diagnosis.
    </div>

    <div class="messages" id="messages">

        <div class="message bot-message">
            <strong>Hello 👋</strong><br><br>

            Ask me about:
            <ul>
                <li>Symptoms</li>
                <li>Diseases</li>
                <li>Medicines</li>
                <li>Health Tips</li>
            </ul>
        </div>

    </div>

    <div class="typing" id="typing">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Ask your medical question..."
            autocomplete="off"
        />

        <button class="send-btn" id="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

    const messages = document.getElementById("messages");
    const typing = document.getElementById("typing");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(text, className){

        const div = document.createElement("div");

        div.className = `message ${className}`;

        // Proper markdown formatting
        if(className === "bot-message"){

            div.innerHTML = marked.parse(text);

        }else{

            div.innerText = text;
        }

        messages.appendChild(div);

        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage(){

        const message = input.value.trim();

        if(!message) return;

        appendMessage(message, "user-message");

        input.value = "";

        typing.style.display = "block";

        $.ajax({

            url:"/chat",

            method:"POST",

            contentType:"application/json",

            data:JSON.stringify({
                message:message
            }),

            success:function(data){

                typing.style.display = "none";

                if(data.response){

                    appendMessage(data.response, "bot-message");

                }else if(data.error){

                    appendMessage("Error: " + data.error, "bot-message");
                }
            },

            error:function(){

                typing.style.display = "none";

                appendMessage("Server connection error.", "bot-message");
            }
        });
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keypress", function(e){

        if(e.key === "Enter"){

            sendMessage();
        }
    });

</script>

</body>
</html>
